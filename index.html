<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Chuỗi 500 & 20/10</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030308;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Lưới chấm bi nguyên bản kết hợp nền vũ trụ */
        .dot-grid {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.14) 1px, transparent 1px);
            background-size: 28px 28px;
            z-index: 2;
            pointer-events: none;
        }

        /* Hiệu ứng Dải Ngân Hà (Galaxy Nebula) */
        .galaxy-nebula {
            position: absolute;
            width: 150vw;
            height: 150vh;
            background: 
                radial-gradient(ellipse at 30% 40%, rgba(138, 43, 226, 0.28) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(0, 180, 255, 0.22) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 50, 150, 0.15) 0%, transparent 60%);
            filter: blur(45px);
            animation: rotateGalaxy 40s linear infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes rotateGalaxy {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(15deg) scale(1.15); }
        }

        /* Canvas vẽ bầu trời sao & sao băng */
        #starCanvas {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* Màn hình 1: Intro */
        #intro-screen {
            position: relative;
            z-index: 10;
            text-align: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .glow-title {
            color: #ffffff;
            font-size: clamp(1.4rem, 3.5vw, 2.5rem);
            font-weight: 900;
            letter-spacing: 8px;
            text-shadow: 
                0 0 8px #fff,
                0 0 18px #fff,
                0 0 35px #b967ff,
                0 0 65px #b967ff;
            margin-bottom: 32px;
            animation: pulseText 2.5s infinite alternate;
        }

        @keyframes pulseText {
            0% { text-shadow: 0 0 8px #fff, 0 0 18px #fff, 0 0 30px #b967ff; }
            100% { text-shadow: 0 0 12px #fff, 0 0 25px #00d2ff, 0 0 50px #00d2ff, 0 0 80px #b967ff; }
        }

        .open-btn {
            background: rgba(15, 15, 30, 0.75);
            color: #fff;
            border: 2px solid #fff;
            padding: 12px 36px;
            font-size: 1.15rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.7), inset 0 0 10px rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(4px);
        }

        .open-btn:hover {
            transform: scale(1.08);
            background: #fff;
            color: #050510;
            box-shadow: 0 0 25px #fff, 0 0 50px #00d2ff;
        }

        .sparkle-icon {
            color: #ffd700;
            font-size: 1.3rem;
            text-shadow: 0 0 8px #ffd700;
        }

        /* Màn hình 2: Vườn hoa & Chữ Chúc Mừng */
        #main-screen {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding-top: 6vh;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s ease;
        }

        #main-screen.show {
            opacity: 1;
            pointer-events: auto;
        }

        .header-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            z-index: 20;
        }

        .congrats-text {
            color: #ffffff;
            font-size: clamp(1.2rem, 3.5vw, 2.5rem);
            font-weight: 900;
            letter-spacing: 5px;
            text-align: center;
            padding: 0 16px;
            text-shadow: 
                0 0 10px #fff,
                0 0 20px #fff,
                0 0 40px #ff4da6,
                0 0 80px #ff4da6;
        }

        .congrats-text span {
            display: inline-block;
            opacity: 0;
            transform: translateY(15px);
            animation: letterIn 0.5s forwards;
        }

        @keyframes letterIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Nút mở thiệp lấp lánh */
        .card-btn {
            background: linear-gradient(135deg, rgba(255, 77, 166, 0.25), rgba(185, 103, 255, 0.25));
            color: #fff;
            border: 1.5px solid #ff99cc;
            padding: 10px 26px;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 77, 166, 0.7), inset 0 0 10px rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(6px);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInBtn 1s ease forwards 2.2s, floatBtn 2.5s ease-in-out infinite alternate 3.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-btn:hover {
            background: #ff4da6;
            color: #fff;
            box-shadow: 0 0 25px #ff4da6, 0 0 45px #ff99cc;
            transform: scale(1.1) !important;
        }

        @keyframes fadeInBtn {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes floatBtn {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-6px); }
        }

        /* Modal Thiệp Chúc Mừng */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 3, 12, 0.78);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .letter-card {
            background: linear-gradient(145deg, rgba(28, 18, 45, 0.95), rgba(15, 10, 28, 0.98));
            border: 2px solid rgba(255, 130, 190, 0.7);
            border-radius: 22px;
            max-width: 500px;
            width: 100%;
            padding: 32px 28px;
            position: relative;
            box-shadow: 
                0 0 30px rgba(255, 77, 166, 0.45),
                0 0 60px rgba(138, 43, 226, 0.3),
                inset 0 0 20px rgba(255, 182, 219, 0.15);
            transform: scale(0.8) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        .modal-overlay.active .letter-card {
            transform: scale(1) translateY(0);
        }

        .close-card {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            color: #ffb3d9;
            font-size: 1.6rem;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
        }

        .close-card:hover {
            color: #fff;
            transform: scale(1.2);
        }

        .card-header {
            text-align: center;
            font-size: 1.35rem;
            color: #ff99cc;
            margin-bottom: 18px;
            font-weight: 700;
            text-shadow: 0 0 12px rgba(255, 153, 204, 0.8);
        }

        .card-body {
            font-size: 1.08rem;
            line-height: 1.75;
            color: #f7e8ff;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.2);
            min-height: 120px;
            white-space: pre-line;
        }

        .card-Sign {
            margin-top: 22px;
            text-align: right;
            font-weight: bold;
            font-style: italic;
            color: #70eaff;
            font-size: 1.05rem;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.7);
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .card-Sign.show-sign {
            opacity: 1;
        }

        /* Nút bật/tắt nhạc góc phải */
        .music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            animation: spinDisk 6s linear infinite;
        }

        @keyframes spinDisk {
            100% { transform: rotate(360deg); }
        }

        /* Khu vực Vườn Hoa */
        .garden {
            position: relative;
            width: 100%;
            max-width: 950px;
            height: 64vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .plant {
            position: absolute;
            bottom: -10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: bottom center;
            transform: scaleY(0);
        }

        #main-screen.show .plant {
            animation: growStem 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards, sway 4.5s ease-in-out infinite alternate 1.8s;
        }

        @keyframes growStem {
            0% { transform: scaleY(0); }
            100% { transform: scaleY(1); }
        }

        @keyframes sway {
            0% { transform: rotate(-2.5deg); }
            100% { transform: rotate(2.5deg); }
        }

        /* Thân cây */
        .stem {
            width: 7px;
            background: linear-gradient(to top, #1b6320, #5cd65c);
            border-radius: 5px;
            position: relative;
            box-shadow: 0 0 10px rgba(92, 214, 92, 0.35);
        }

        /* Lá trên thân */
        .leaf {
            position: absolute;
            width: 28px;
            height: 13px;
            background: linear-gradient(135deg, #6ef06e, #288a2c);
            border-radius: 20px 0 20px 0;
            box-shadow: 0 0 8px rgba(92, 214, 92, 0.4);
        }

        .leaf.left {
            left: -26px;
            transform: rotate(-20deg);
            border-radius: 0 20px 0 20px;
        }

        .leaf.right {
            right: -26px;
            transform: rotate(20deg);
        }

        /* Bông hoa trắng 8 cánh */
        .white-flower {
            position: relative;
            width: 90px;
            height: 90px;
            margin-bottom: -12px;
            z-index: 3;
            transform: scale(0);
        }

        #main-screen.show .white-flower {
            animation: bloomFlower 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            animation-delay: 1.1s;
        }

        .white-flower .petal {
            position: absolute;
            width: 26px;
            height: 64px;
            background: #ffffff;
            border-radius: 50%;
            top: 13px;
            left: 32px;
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.95);
        }

        .white-flower .petal:nth-child(1) { transform: rotate(0deg); }
        .white-flower .petal:nth-child(2) { transform: rotate(45deg); }
        .white-flower .petal:nth-child(3) { transform: rotate(90deg); }
        .white-flower .petal:nth-child(4) { transform: rotate(135deg); }

        .white-flower .center {
            position: absolute;
            width: 26px;
            height: 26px;
            background: radial-gradient(circle, #fff 20%, #ffd1ea 100%);
            border-radius: 50%;
            top: 32px;
            left: 32px;
            box-shadow: 0 0 15px #ffbdf0;
        }

        /* Bông hoa trắng 6 cánh nhọn */
        .star-flower {
            position: relative;
            width: 80px;
            height: 80px;
            margin-bottom: -10px;
            z-index: 3;
            transform: scale(0);
        }

        #main-screen.show .star-flower {
            animation: bloomFlower 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            animation-delay: 1.3s;
        }

        .star-flower .petal {
            position: absolute;
            width: 22px;
            height: 76px;
            background: #ffffff;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            top: 2px;
            left: 29px;
            box-shadow: 0 0 20px #ffffff, 0 0 35px #fff5cc;
        }

        .star-flower .petal:nth-child(1) { transform: rotate(0deg); }
        .star-flower .petal:nth-child(2) { transform: rotate(60deg); }
        .star-flower .petal:nth-child(3) { transform: rotate(120deg); }

        .star-flower .center {
            position: absolute;
            width: 22px;
            height: 22px;
            background: #fff9d6;
            border-radius: 50%;
            top: 29px;
            left: 29px;
            box-shadow: 0 0 12px #ffe680;
        }

        /* Hoa Tulip Hồng Đỏ */
        .tulip-flower {
            position: relative;
            width: 44px;
            height: 54px;
            margin-bottom: -6px;
            z-index: 3;
            transform: scale(0);
        }

        #main-screen.show .tulip-flower {
            animation: bloomFlower 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            animation-delay: 1.4s;
        }

        .tulip-flower .tulip-petal {
            position: absolute;
            background: linear-gradient(to top, #d4145a, #ff5e8e);
            box-shadow: 0 0 16px rgba(255, 75, 130, 0.85);
        }

        .tulip-flower .tulip-petal.middle {
            width: 28px;
            height: 50px;
            left: 8px;
            top: 2px;
            border-radius: 45% 45% 40% 40%;
            z-index: 2;
        }

        .tulip-flower .tulip-petal.left {
            width: 24px;
            height: 44px;
            left: 0;
            top: 8px;
            border-radius: 50% 20% 40% 50%;
            transform: rotate(-14deg);
            z-index: 1;
        }

        .tulip-flower .tulip-petal.right {
            width: 24px;
            height: 44px;
            right: 0;
            top: 8px;
            border-radius: 20% 50% 50% 40%;
            transform: rotate(14deg);
            z-index: 1;
        }

        @keyframes bloomFlower {
            0% { transform: scale(0) rotate(-25deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* Cỏ dài dưới gốc */
        .grass-blade {
            position: absolute;
            bottom: -10px;
            width: 9px;
            background: linear-gradient(to top, #144917, #4ec94e);
            border-radius: 100% 0 0 0;
            transform-origin: bottom center;
            transform: scaleY(0);
            box-shadow: 0 0 8px rgba(78, 201, 78, 0.25);
        }

        #main-screen.show .grass-blade {
            animation: growGrass 1.5s ease-out forwards;
        }

        @keyframes growGrass {
            to { transform: scaleY(1) rotate(var(--rot)); }
        }
    </style>
</head>
<body>

    <!-- Nhạc nền 3 Strikes (Ưu tiên file nhac.mp3 cùng thư mục + Dự phòng YouTube) -->
    <audio id="bgMusic" loop>
        <source src="nhac.mp3" type="audio/mpeg">
    </audio>
    <div id="yt-player-container" style="position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none;"></div>
    <button class="music-control" id="musicBtn" title="Bật/Tắt nhạc">🎵</button>

    <!-- Hiệu ứng Dải Ngân Hà & Sao sáng -->
    <div class="galaxy-nebula"></div>
    <canvas id="starCanvas"></canvas>
    <div class="dot-grid"></div>

    <!-- Màn hình 1: Nút bấm mở quà -->
    <div id="intro-screen">
        <h1 class="glow-title">I Have Something</h1>
        <button class="open-btn" id="openBtn">
            <span class="sparkle-icon">✦</span> Open
        </button>
    </div>

    <!-- Màn hình 2: Chúc mừng chuỗi 500, Nút mở thiệp & Vườn hoa -->
    <div id="main-screen">
        <div class="header-box">
            <h1 class="congrats-text" id="congratsTitle"></h1>
            <button class="card-btn" id="openCardBtn">
                💌 Mở thiệp
            </button>
        </div>

        <div class="garden">
            <!-- Cây 1 -->
            <div class="plant" style="left: 8%; animation-delay: 0.2s;">
                <div class="white-flower" style="transform: scale(0.85);">
                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                    <div class="center"></div>
                </div>
                <div class="stem" style="height: 150px;">
                    <div class="leaf left" style="top: 35px;"></div>
                    <div class="leaf right" style="top: 65px;"></div>
                    <div class="leaf left" style="top: 95px;"></div>
                </div>
            </div>

            <!-- Cây 2 -->
            <div class="plant" style="left: 20%; animation-delay: 0.4s;">
                <div class="tulip-flower">
                    <div class="tulip-petal left"></div>
                    <div class="tulip-petal right"></div>
                    <div class="tulip-petal middle"></div>
                </div>
                <div class="stem" style="height: 210px;">
                    <div class="leaf left" style="top: 30px;"></div>
                    <div class="leaf right" style="top: 75px;"></div>
                    <div class="leaf left" style="top: 120px;"></div>
                    <div class="leaf right" style="top: 160px;"></div>
                </div>
            </div>

            <!-- Cây 3 -->
            <div class="plant" style="left: 34%; animation-delay: 0.1s;">
                <div class="star-flower">
                    <div class="petal"></div><div class="petal"></div><div class="petal"></div>
                    <div class="center"></div>
                </div>
                <div class="stem" style="height: 265px;">
                    <div class="leaf right" style="top: 30px;"></div>
                    <div class="leaf left" style="top: 75px;"></div>
                    <div class="leaf right" style="top: 120px;"></div>
                    <div class="leaf left" style="top: 165px;"></div>
                    <div class="leaf right" style="top: 210px;"></div>
                </div>
            </div>

            <!-- Cây 4 -->
            <div class="plant" style="left: 42%; animation-delay: 0.5s;">
                <div class="tulip-flower">
                    <div class="tulip-petal left"></div>
                    <div class="tulip-petal right"></div>
                    <div class="tulip-petal middle"></div>
                </div>
                <div class="stem" style="height: 220px;">
                    <div class="leaf left" style="top: 40px;"></div>
                    <div class="leaf right" style="top: 90px;"></div>
                    <div class="leaf left" style="top: 140px;"></div>
                </div>
            </div>

            <!-- Cây 5: Chính giữa -->
            <div class="plant" style="left: 49%; animation-delay: 0s;">
                <div class="white-flower" style="transform: scale(1.15);">
                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                    <div class="center"></div>
                </div>
                <div class="stem" style="height: 330px;">
                    <div class="leaf left" style="top: 25px;"></div>
                    <div class="leaf right" style="top: 70px;"></div>
                    <div class="leaf left" style="top: 120px;"></div>
                    <div class="leaf right" style="top: 170px;"></div>
                    <div class="leaf left" style="top: 220px;"></div>
                    <div class="leaf right" style="top: 270px;"></div>
                </div>
            </div>

            <!-- Cây 6 -->
            <div class="plant" style="left: 56%; animation-delay: 0.3s;">
                <div class="tulip-flower">
                    <div class="tulip-petal left"></div>
                    <div class="tulip-petal right"></div>
                    <div class="tulip-petal middle"></div>
                </div>
                <div class="stem" style="height: 230px;">
                    <div class="leaf right" style="top: 35px;"></div>
                    <div class="leaf left" style="top: 85px;"></div>
                    <div class="leaf right" style="top: 135px;"></div>
                    <div class="leaf left" style="top: 185px;"></div>
                </div>
            </div>

            <!-- Cây 7 -->
            <div class="plant" style="left: 63%; animation-delay: 0.2s;">
                <div class="star-flower">
                    <div class="petal"></div><div class="petal"></div><div class="petal"></div>
                    <div class="center"></div>
                </div>
                <div class="stem" style="height: 280px;">
                    <div class="leaf left" style="top: 20px;"></div>
                    <div class="leaf right" style="top: 65px;"></div>
                    <div class="leaf left" style="top: 115px;"></div>
                    <div class="leaf right" style="top: 165px;"></div>
                    <div class="leaf left" style="top: 215px;"></div>
                </div>
            </div>

            <!-- Cây 8 -->
            <div class="plant" style="left: 77%; animation-delay: 0.45s;">
                <div class="tulip-flower">
                    <div class="tulip-petal left"></div>
                    <div class="tulip-petal right"></div>
                    <div class="tulip-petal middle"></div>
                </div>
                <div class="stem" style="height: 225px;">
                    <div class="leaf left" style="top: 40px;"></div>
                    <div class="leaf right" style="top: 90px;"></div>
                    <div class="leaf left" style="top: 145px;"></div>
                </div>
            </div>

            <!-- Cây 9 -->
            <div class="plant" style="left: 86%; animation-delay: 0.35s;">
                <div class="white-flower">
                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                    <div class="center"></div>
                </div>
                <div class="stem" style="height: 175px;">
                    <div class="leaf left" style="top: 40px;"></div>
                    <div class="leaf right" style="top: 75px;"></div>
                    <div class="leaf left" style="top: 115px;"></div>
                </div>
            </div>

            <!-- Cỏ đan xen -->
            <div class="grass-blade" style="left: 6%; height: 140px; --rot: -8deg;"></div>
            <div class="grass-blade" style="left: 14%; height: 190px; --rot: 5deg;"></div>
            <div class="grass-blade" style="left: 18%; height: 220px; --rot: -4deg;"></div>
            <div class="grass-blade" style="left: 25%; height: 180px; --rot: 14deg;"></div>
            <div class="grass-blade" style="left: 32%; height: 150px; --rot: -6deg;"></div>
            <div class="grass-blade" style="left: 40%; height: 200px; --rot: 10deg;"></div>
            <div class="grass-blade" style="left: 47%; height: 170px; --rot: -5deg;"></div>
            <div class="grass-blade" style="left: 61%; height: 240px; --rot: -12deg;"></div>
            <div class="grass-blade" style="left: 67%; height: 210px; --rot: 12deg;"></div>
            <div class="grass-blade" style="left: 73%; height: 150px; --rot: -15deg;"></div>
            <div class="grass-blade" style="left: 81%; height: 220px; --rot: 8deg;"></div>
            <div class="grass-blade" style="left: 93%; height: 160px; --rot: -6deg;"></div>
            <div class="grass-blade" style="left: 96%; height: 250px; --rot: -3deg;"></div>
        </div>
    </div>

    <!-- Hộp Thiệp (Modal) -->
    <div class="modal-overlay" id="cardModal">
        <div class="letter-card">
            <button class="close-card" id="closeCardBtn">&times;</button>
            <div class="card-header">✨ Gửi người nhận đặc biệt ✨</div>
            <div class="card-body" id="letterContent"></div>
            <div class="card-Sign" id="letterSign">người gửi skibidi :))</div>
        </div>
    </div>

    <script>
        const openBtn = document.getElementById('openBtn');
        const introScreen = document.getElementById('intro-screen');
        const mainScreen = document.getElementById('main-screen');
        const congratsTitle = document.getElementById('congratsTitle');
        const bgMusic = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        const ytContainer = document.getElementById('yt-player-container');

        const message = "CHÚC MỪNG CHUỖI 500 🔥";

        // Xử lý phát nhạc "3 Strikes - Terror Jr"
        let isPlaying = false;
        function startMusic() {
            musicBtn.style.display = 'flex';
            bgMusic.play().then(() => {
                isPlaying = true;
            }).catch(() => {
                // Nếu chưa có file nhac.mp3, tự động nhúng nhạc 3 Strikes từ YouTube
                ytContainer.innerHTML = `<iframe width="100" height="100" src="https://www.youtube.com/embed/vital284N84?autoplay=1&loop=1&playlist=vital284N84" allow="autoplay"></iframe>`;
                isPlaying = true;
            });
        }

        musicBtn.addEventListener('click', () => {
            if (isPlaying) {
                bgMusic.pause();
                ytContainer.innerHTML = '';
                musicBtn.style.animationPlayState = 'paused';
                musicBtn.textContent = '🔇';
                isPlaying = false;
            } else {
                startMusic();
                musicBtn.style.animationPlayState = 'running';
                musicBtn.textContent = '🎵';
            }
        });

        // Bấm nút Open ở màn hình 1
        openBtn.addEventListener('click', () => {
            startMusic();
            introScreen.style.opacity = '0';
            introScreen.style.transform = 'scale(0.85)';
            setTimeout(() => {
                introScreen.style.display = 'none';
                mainScreen.classList.add('show');
                renderGlowingText();
            }, 700);
        });

        function renderGlowingText() {
            congratsTitle.innerHTML = '';
            [...message].forEach((char, index) => {
                const span = document.createElement('span');
                span.textContent = char === ' ' ? '\u00A0' : char;
                span.style.animationDelay = `${index * 0.07}s`;
                congratsTitle.appendChild(span);
            });
        }

        // Xử lý mở và đóng Thiệp chúc 20/10
        const openCardBtn = document.getElementById('openCardBtn');
        const closeCardBtn = document.getElementById('closeCardBtn');
        const cardModal = document.getElementById('cardModal');
        const letterContent = document.getElementById('letterContent');
        const letterSign = document.getElementById('letterSign');

        const fullLetterText = "hello npcpncc =)) nay hậu 20/10 chúc bù nhe, chúc chị 20/10 vui vẻ, xinh đẹp, luôn tràn đầy hạnh phúc, niềm vui, may mắn và luôn được trân trọng nhá";
        let typingTimer;

        openCardBtn.addEventListener('click', () => {
            cardModal.classList.add('active');
            letterContent.textContent = '';
            letterSign.classList.remove('show-sign');
            clearInterval(typingTimer);

            let idx = 0;
            typingTimer = setInterval(() => {
                if (idx < fullLetterText.length) {
                    letterContent.textContent += fullLetterText.charAt(idx);
                    idx++;
                } else {
                    clearInterval(typingTimer);
                    letterSign.classList.add('show-sign');
                }
            }, 35);
        });

        closeCardBtn.addEventListener('click', () => {
            cardModal.classList.remove('active');
            clearInterval(typingTimer);
        });

        cardModal.addEventListener('click', (e) => {
            if (e.target === cardModal) {
                cardModal.classList.remove('active');
                clearInterval(typingTimer);
            }
        });

        /* Hiệu ứng Dải Ngân Hà, Ngôi Sao Lấp Lánh & Sao Băng */
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];
        let shootingStars = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const starColors = ['#ffffff', '#ffe9c4', '#d4fbff', '#f3d4ff', '#ffb8e6'];
        for (let i = 0; i < 280; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.8 + 0.3,
                color: starColors[Math.floor(Math.random() * starColors.length)],
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005,
                isSparkle: Math.random() > 0.88
            });
        }

        function createShootingStar() {
            shootingStars.push({
                x: Math.random() * width * 0.8 + width * 0.1,
                y: Math.random() * height * 0.35,
                len: Math.random() * 90 + 50,
                speed: Math.random() * 10 + 8,
                alpha: 1
            });
        }

        setInterval(() => {
            if (Math.random() > 0.3) createShootingStar();
        }, 2200);

        function animateGalaxy() {
            ctx.clearRect(0, 0, width, height);

            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha >= 1 || star.alpha <= 0.15) {
                    star.speed = -star.speed;
                }

                ctx.save();
                ctx.globalAlpha = Math.max(0.1, Math.min(1, star.alpha));
                ctx.fillStyle = star.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = star.color;

                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();

                if (star.isSparkle && star.alpha > 0.6) {
                    ctx.strokeStyle = star.color;
                    ctx.lineWidth = 0.7;
                    ctx.beginPath();
                    ctx.moveTo(star.x - star.radius * 4, star.y);
                    ctx.lineTo(star.x + star.radius * 4, star.y);
                    ctx.moveTo(star.x, star.y - star.radius * 4);
                    ctx.lineTo(star.x, star.y + star.radius * 4);
                    ctx.stroke();
                }
                ctx.restore();
            });

            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const s = shootingStars[i];
                ctx.save();
                const grad = ctx.createLinearGradient(s.x, s.y, s.x + s.len, s.y - s.len * 0.6);
                grad.addColorStop(0, `rgba(255, 255, 255, ${s.alpha})`);
                grad.addColorStop(1, 'rgba(255, 255, 255, 0)');

                ctx.strokeStyle = grad;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#00d2ff';
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(s.x + s.len, s.y - s.len * 0.6);
                ctx.stroke();
                ctx.restore();

                s.x -= s.speed;
                s.y += s.speed * 0.6;
                s.alpha -= 0.018;

                if (s.alpha <= 0) {
                    shootingStars.splice(i, 1);
                }
            }

            requestAnimationFrame(animateGalaxy);
        }

        animateGalaxy();
    </script>
</body>
</html>
